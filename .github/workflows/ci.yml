name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Validate catalog
        run: npm run validate

      - name: Build (all platforms)
        run: npm run build:all

      - name: Inspect publishable tarball
        run: npm pack --dry-run

      - name: Verify generated files are in sync with sources
        run: |
          if ! git diff --quiet -- platforms Sources/IdnFinLogos; then
            echo "::error::Generated platform files are out of sync with data/. Run 'npm run build:all' and commit the result."
            git diff -- platforms Sources/IdnFinLogos | head -200
            exit 1
          fi

      - name: Upload dist/ artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
