name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # for gh release create
  id-token: write   # for npm provenance via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - run: npm run validate

      - run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build SVG-only zip for GitHub Release
        run: |
          mkdir -p release-assets
          cd dist/icons
          zip -qr "../../release-assets/idn-finlogos-svg-${GITHUB_REF_NAME}.zip" ./*.svg
          cd ../..

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            release-assets/idn-finlogos-svg-${GITHUB_REF_NAME}.zip
