name: idn_finlogos
description: Indonesian financial institution logos (banks, e-wallets, payment gateways, and 20+ more categories) as bundled SVG assets, with a typed Dart catalog API.
# Rewritten by scripts/build-flutter.mjs to mirror the npm package version.
version: 2.1.6
homepage: https://github.com/hafidznoor/idn-finlogos
repository: https://github.com/hafidznoor/idn-finlogos
issue_tracker: https://github.com/hafidznoor/idn-finlogos/issues
topics:
  - icons
  - logos
  - indonesia
  - fintech
  - svg

